language: python

python:
  - "3.12"

install:
  - pip install -r djangotutorial/requirements.txt

before_script:
  - cd djangotutorial

script:
  - black --check .
  - flake8 .
  - coverage run manage.py test
  - coverage report

after_success:
  - coveralls

deploy:
  provider: elasticbeanstalk
  edge: true
  region: us-east-2
  app: django-tutorial
  env: django-env
  bucket: elasticbeanstalk-us-east-2-373550663668
  access_key_id: $AWS_ACCESS_KEY_ID
  secret_access_key: $AWS_SECRET_ACCESS_KEY
  on:
    branch: main